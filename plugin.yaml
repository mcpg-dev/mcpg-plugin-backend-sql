schema: mcpg.dev/plugin/v1
id: dev.mcpg.backend.sql
name: SQL Binding
license: Apache-2.0
description: |
  Dispatches tool calls as parameterised SQL statements against a
  configured database pool. Supports PostgreSQL, MySQL, and SQLite
  drivers. The same plugin carries four watch strategies:
  sql_polling (a tracking query changed), postgres_listen_notify
  (a NOTIFY arrived), sql_changes (each inserted, updated or deleted
  row a keyset query reads) and postgres_cdc (each row change a
  publication carries, read from a logical replication slot with the
  built-in pgoutput plugin, the slot advanced once the gateway has every
  change of a transaction).
class: backend
runtime: native-cdylib-v1
protocol_version: "1.0"
required_capabilities: [network_outbound]
# MCP Events: how each watch runs as a source, and what it emits.
watch_strategies:
  - kind: postgres_listen_notify
    placement: single_owner
    resume: false
    event_types:
      - name: postgres.notification
        description: One NOTIFY on the watched channel.
        payload_schema:
          type: object
          required: [channel, payloadEncoding]
          properties:
            channel: { type: string }
            payload:
              description: The NOTIFY payload, read as payloadEncoding says.
            payloadEncoding:
              description: How payload holds the NOTIFY payload - its JSON, or its text.
              enum: [json, text]
  - kind: sql_changes
    placement: single_owner
    resume: true
    event_types:
      - name: sql.row.changed
        description: One row the keyset query read - an insert, an update or a delete.
        payload_schema:
          type: object
          required: [op, row]
          properties:
            op:
              description: What the change did, from op_column; insert when the watch has none.
              enum: [insert, update, delete]
            row:
              type: object
              description: The row, each column by name. Timestamps are RFC 3339 text and decimals are text.
  - kind: postgres_cdc
    placement: single_owner
    resume: true
    event_types:
      - name: sql.row.changed
        description: One row change a publication carries, from the replication slot. The eventId is slot/lsn.
        payload_schema:
          type: object
          required: [op, schema, table, row, lsn]
          properties:
            op: { enum: [insert, update, delete] }
            schema: { type: string }
            table: { type: string }
            row:
              type: object
              description: The row after the change; for a delete, the old key, or the old row under REPLICA IDENTITY FULL. Numbers, booleans and JSON as such, numeric and other types as PostgreSQL's text.
            old: { type: object, description: "An update's old row, when the replica identity sends one." }
            unchanged: { type: array, items: { type: string }, description: TOASTed columns the change left as they were, so not sent. }
            lsn: { type: string, description: "The change's LSN, X/Y." }
            xid: { type: integer }
            commitTime: { type: string, description: When its transaction committed, RFC 3339; also the event time. }
      - name: sql.table.truncated
        description: A TRUNCATE of a table the publication carries.
        payload_schema:
          type: object
          required: [schema, table, lsn]
          properties:
            schema: { type: string }
            table: { type: string }
            cascade: { type: boolean }
            restartIdentity: { type: boolean }
            lsn: { type: string }
            xid: { type: integer }
            commitTime: { type: string }
